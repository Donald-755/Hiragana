<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiragana Trainer</title>
<meta name="theme-color" content="#3446a6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hiragana">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: Seitenleiste links, Arbeitsfläche rechts über die volle Breite; Inhalte in mehrspaltigen Rastern */
  --bg:#f3f4f7; --surface:#ffffff; --ink:#15171c; --muted:#646a78; --line:#e2e4ea;
  --accent:#3446a6; --accent-soft:#e9ecf8; --on-accent:#ffffff;
  --good:#22845a; --good-soft:#e1f2e9; --bad:#c23a2f; --bad-soft:#fbe8e6; --warn:#b7791f; --warn-soft:#fbf1dc;
  --m0:#dde0e7; --m1:#e3ad37; --m2:#7b8de0; --m3:#2f9a66;
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-kana:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  --r:14px; --side:236px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#181b22; --ink:#eceef4; --muted:#9aa1b2; --line:#2a2f3a;
    --accent:#8e9dff; --accent-soft:#232947; --on-accent:#0f1115;
    --good:#4cc38a; --good-soft:#15342a; --bad:#ff7d70; --bad-soft:#3b1f1c; --warn:#f0b54a; --warn-soft:#3a2e15;
    --m0:#2b303b; --m1:#d8a33a; --m2:#6f83e2; --m3:#3fb57c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b22; --ink:#eceef4; --muted:#9aa1b2; --line:#2a2f3a;
  --accent:#8e9dff; --accent-soft:#232947; --on-accent:#0f1115;
  --good:#4cc38a; --good-soft:#15342a; --bad:#ff7d70; --bad-soft:#3b1f1c; --warn:#f0b54a; --warn-soft:#3a2e15;
  --m0:#2b303b; --m1:#d8a33a; --m2:#6f83e2; --m3:#3fb57c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kana{font-family:var(--font-kana)}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
h3{font-size:15px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}

/* App-Gerüst */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
aside{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:22px;padding:22px 16px}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:17px;padding:0 8px}
.brand .kana{font-size:22px;color:var(--accent);font-weight:700}
nav{display:flex;flex-direction:column;gap:4px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;text-align:left}
nav button svg{flex:none}
nav button:hover{color:var(--ink);background:var(--bg)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.goal-mini{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.goal-mini .mini{margin:0}
.side-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
.sync{font-size:12px;color:var(--muted)}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
main{padding:28px clamp(18px,3vw,44px) 56px;min-width:0}
.view{display:none}
.view.on{display:block}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 14px;gap:12px;z-index:5;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  nav{flex-direction:row}
  nav button{padding:8px 10px}
  nav button span{display:none}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .goal-mini,.sync{display:none}
  .brand{white-space:nowrap;padding:0;font-size:15px}.brand .kana{font-size:18px}
  .brand span:last-child{display:none}
  aside{gap:8px;padding:8px 10px}nav{gap:2px}nav button{padding:8px}
  main{padding-top:18px}
}

.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:11px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.light{background:var(--on-accent);color:var(--accent)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:var(--bad);color:#fff}
kbd{font:600 11px var(--font-ui);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--surface)}
.kbd-inv{background:transparent;color:inherit;border-color:currentColor}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.hi{background:var(--bad-soft);color:var(--bad)}
.pill.mid{background:var(--warn-soft);color:var(--warn)}
.pill.lo{background:var(--good-soft);color:var(--good)}
.pill.na{background:var(--bg);color:var(--muted)}
.pill.ac{background:var(--accent-soft);color:var(--accent)}
.mini{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;border-radius:99px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty-note{color:var(--muted);font-size:14px;padding:6px 0}

/* Übersicht */
.home{display:grid;grid-template-columns:minmax(0,1fr) clamp(320px,26vw,420px);gap:22px;align-items:start}
@media (max-width:1100px){.home{grid-template-columns:1fr}}
.hero{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent);color:var(--on-accent);border:0;padding:26px 28px}
.hero h2{font-size:24px}
.hero p{margin:4px 0 0;opacity:.85}
.groups{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;display:inline-flex;gap:8px;align-items:center}
.chip .kana{font-size:15px}
.chip small{color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.75}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s;min-height:132px}
.mode:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.mode .ico{font-family:var(--font-kana);font-size:22px;color:var(--accent);font-weight:700;height:30px}
.mode b{font-size:15px}
.mode span{font-size:13px;color:var(--muted)}
.mode.feat{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--surface) 70%)}
.today{display:flex;gap:18px;align-items:center}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-size:24px;display:block}
.ring small{font-size:11.5px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;flex:1}
.kpi b{font-size:20px;font-weight:700;display:block}
.kpi span{font-size:12.5px;color:var(--muted)}
.pairrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.pairrow:first-of-type{border-top:0}
.pairrow:hover .pk{color:var(--accent)}
.pk{font-family:var(--font-kana);font-size:26px;white-space:nowrap}
.pk em{font-style:normal;font-size:14px;color:var(--muted);margin:0 6px;font-family:var(--font-ui)}
.pairrow .t{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grp-bars{display:flex;flex-direction:column;gap:10px}
.grp-bars .row{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.stack-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--m0)}
.stack-bar i{display:block;height:100%}

/* Sitzung */
.sessgrid{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,380px);gap:24px;height:calc(100vh - 84px);min-height:440px}
@media (max-width:1000px){.sessgrid{grid-template-columns:1fr;min-height:0;height:auto}.qcard{min-height:300px!important}}
.sess-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.sess-top{display:flex;align-items:center;gap:14px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.count{font-size:13px;color:var(--muted);min-width:70px;text-align:right}
.qcard{flex:1;min-height:300px;background:var(--surface);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px;position:relative;transition:background .2s,border-color .2s}
.qcard.ok{border-color:var(--good);background:var(--good-soft);animation:pop .25s}
.qcard.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .25s}
.prompt{font-size:max(64px,min(14vw,24vh,190px));line-height:1.05;font-weight:500}
.prompt.yo{font-size:max(56px,min(11vw,19vh,150px))}
.prompt.romaji{font-family:var(--font-ui);font-size:clamp(64px,8vw,104px);font-weight:700;letter-spacing:-.02em}
.qcard .tag{position:absolute;top:16px;left:18px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qcard .spk{position:absolute;top:12px;right:12px}
.reveal{font-size:26px;font-weight:700;min-height:36px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opts.n2{grid-template-columns:repeat(2,1fr)}.opts.n3{grid-template-columns:repeat(3,1fr)}
@media (max-width:640px){.opts,.opts.n3{grid-template-columns:repeat(2,1fr)}}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 14px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;transition:border-color .15s;min-height:76px}
.opt .k{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;font-weight:600;flex:none}
.opt .v{flex:1;text-align:center}
.opt .v.kana{font-size:36px;font-weight:500;line-height:1.1}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt:disabled{cursor:default}
.typerow{display:flex;gap:12px}
.typerow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;font-size:24px;font-weight:700;text-align:center}
.typerow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sess-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-height:44px}
.hint{font-size:12.5px;color:var(--muted)}
.timer{font-size:13px;font-weight:700;min-width:54px;text-align:right}
.sess-side{display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto;min-height:0}
.sess-main{min-height:0}
.cardbtns{height:68px}.cardbtns .btn{height:100%;padding-top:0;padding-bottom:0}
.sess-main>.sess-foot{height:52px;min-height:52px;flex:none;flex-wrap:nowrap;overflow:visible;padding:0 3px}
.sess-main>.sess-foot .hint{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sess-main>.opts,.sess-main>.typerow,.sess-main>.cardbtns,.sess-main>.sess-top{flex:none}
.qcard{min-height:0!important;overflow:hidden}
.typo-msg{color:var(--warn)!important;font-weight:600}
.rd-typo{font-size:13px;font-weight:600;color:var(--warn)}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.typo-fx{animation:nudge .2s;border-color:var(--warn)!important;box-shadow:0 0 0 3px var(--warn-soft)!important}
.sess-side .card{padding:16px}
.live{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.live div b{display:block;font-size:20px}
.live div span{font-size:12px;color:var(--muted)}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hist span{font-family:var(--font-kana);font-size:17px;min-width:34px;height:34px;padding:0 4px;display:grid;place-items:center;border-radius:8px}
.hist .y{background:var(--good-soft);color:var(--good)}
.hist .n{background:var(--bad-soft);color:var(--bad)}
.cmp{display:flex;justify-content:center;gap:12px;align-items:stretch}
.cmp div{flex:1;text-align:center;border-radius:12px;padding:10px 6px;border:1px solid var(--line)}
.cmp .kana{font-size:52px;line-height:1.15;display:block}
.cmp b{font-size:14px}
.cmp .y{border-color:var(--good);background:var(--good-soft)}
.cmp .n{border-color:var(--bad);background:var(--bad-soft)}
.cmp small{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tiplist{display:flex;flex-direction:column;gap:10px}
.tip{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:13px}
.tip .pk{font-size:20px}
.res{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.res-head{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.res-big{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile b{display:block;font-size:22px}
.tile span{font-size:12.5px;color:var(--muted)}
.mistakes{display:flex;flex-wrap:wrap;gap:8px}
.mk{display:flex;align-items:center;gap:8px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:6px 10px;font-weight:700}
.mk .kana{font-size:22px;color:var(--ink);font-weight:500}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fmtbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fmtseg{flex:1;min-width:280px;background:var(--surface)}
.fmtseg button{display:flex;flex-direction:column;align-items:center;gap:0;padding:9px 8px;line-height:1.3}
.fmtseg button b{font-size:13.5px}
.fmtseg button small{font-size:11.5px;font-weight:500;opacity:.8}
.fmtseg button+button{border-left:1px solid var(--line)}
.mode .mfmt{margin-top:auto;padding-top:4px}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cardbtns .flip{grid-column:1/-1;padding:20px;font-size:17px}
.btn.rate{padding:20px;font-size:17px;border:1px solid}
.btn.rate.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.rate.yes{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.btn.rate kbd{background:transparent;color:inherit;border-color:currentColor}
.btn:disabled{opacity:.5;cursor:default}
.kochpool{display:flex;flex-wrap:wrap;gap:5px}
.kochpool span{font-size:18px;min-width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--bg)}
.kochpool span.new{background:var(--accent);color:var(--on-accent)}
.kbar{position:relative;height:8px;background:var(--line);border-radius:99px;margin-top:6px}
.kbar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.kbar span{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5}
.lesen{display:grid;grid-template-columns:250px minmax(0,1fr) clamp(280px,22vw,340px);gap:20px;align-items:start}
.rside{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding-bottom:2px}
@media (max-width:1300px){.lesen{grid-template-columns:230px minmax(0,1fr)}.rside{grid-column:2;position:static;max-height:none}}
@media (max-width:860px){.lesen{grid-template-columns:1fr}.rside{grid-column:auto}}
.stlist{display:flex;flex-direction:column;gap:8px;position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding-right:2px}
@media (max-width:860px){.stlist{position:static;max-height:none;flex-direction:row;overflow-x:auto}.stlist .st{min-width:200px}.stlist .sec-title{display:none}}
.st{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.st:hover{border-color:var(--muted)}
.st.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.st-t{font-size:19px;font-weight:500}
.st-d{font-size:12.5px;color:var(--muted)}
.st-m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;margin-top:4px}
.reader{padding:24px 28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.rd-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.rd-title{font-size:32px;font-weight:700;letter-spacing:0}
.rdseg{min-width:300px}
.rdseg button{display:flex;flex-direction:column;align-items:center;padding:8px 14px;line-height:1.3}
.rdseg button small{font-size:11px;font-weight:500;opacity:.8}
.rdseg button+button{border-left:1px solid var(--line)}
.rd-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sents{display:flex;flex-direction:column;gap:6px}
.sent{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:12px 10px;border-radius:12px}
.sent.cur{background:var(--accent-soft)}
.sn{font-size:12px;color:var(--muted);font-weight:700;padding-top:12px;text-align:right}
.jp{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 6px}
.w{background:none;border:1px solid transparent;border-radius:9px;padding:2px 4px;display:flex;flex-direction:column;align-items:center}
.w:hover{background:var(--bg)}
.w .wk{font-size:30px;line-height:1.35}
.w .wr{font-size:13px;font-weight:700;color:var(--accent);min-height:18px;visibility:hidden}
.w .wr.on{visibility:visible}
.w.sel{border-color:var(--accent);background:var(--accent-soft)}

details.tips summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);list-style:none}

.list{display:flex;flex-direction:column}

.detail{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.detail-k{font-size:96px;line-height:1.1;padding:0 10px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--bg);border-radius:10px;padding:10px 12px}
.kv b{display:block;font-size:18px}
.kv span{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:30}

@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:scale(1)}}

const ROWS=[
 {id:"a",g:"basic",items:"あ:a い:i う:u え:e お:o"},

function pairTip(a,b){
  const t=TIPS[pkey(a,b)];if(t)return t;
  if(base(a)===base(b)&&a!==b){const m=x=>/゚/.test(x.normalize("NFD"))?"゜ (p)":/゙/.test(x.normalize("NFD"))?"゛ (stimmhaft)":"ohne Zeichen";return `Gleiche Grundform ${base(a)}. ${a}: ${m(a)}, ${b}: ${m(b)}.`}
  if(a.length===2&&b.length===2&&a[0]===b[0])return "Gleicher Anfang. Das kleine Zeichen entscheidet: ゃ = a, ゅ = u, ょ = o.";
  if(a.length===2&&b.length===2&&a[1]===b[1])return `Gleicher Vokal, aber anderes erstes Zeichen: ${a[0]} gegen ${b[0]}.`;
  return "";
}

function record(item,ok,ms,picked,promoteMode){
  const now=Date.now(),s=ks(item.k),t=Math.min(ms,15000);
  s.n++;s.l=now;
  if(ok){s.c++;s.st++;s.ms+=t;if(promoteMode==="srs"||s.b===0||s.d<=now){s.b=Math.min(s.b+1,INT.length-1);s.d=now+INT[s.b]}}
  else{s.st=0;s.b=Math.max(1,s.b-2);s.d=now+INT[1];if(picked&&picked!==item.k)s.cf[picked]=(s.cf[picked]||0)+1}
  const d=S.days[dayKey()]||(S.days[dayKey()]={a:0,c:0,ms:0});
  d.a++;if(ok)d.c++;d.ms+=t;S.totalMs+=t;
  save();renderGoalMini();
}
/* Persönliche Verwechslungspaare, symmetrisch zusammengefasst */
function confusionPairs(){const p={};Object.entries(S.kana).forEach(([k,s])=>Object.entries(s.cf||{}).forEach(([o,c])=>{if(!BYK[o])return;const key=pkey(k,o);p[key]=(p[key]||0)+c}));return Object.entries(p).map(([key,c])=>{const [a,b]=key.split("|");return {a,b,c}}).sort((x,y)=>y.c-x.c)}
const groupConf=g=>{let n=0;g.k.forEach(a=>{const cf=(S.kana[a]||{}).cf||{};g.k.forEach(b=>{if(cf[b])n+=cf[b]})});return n};
function groupRisk(g){
  const its=g.k.map(k=>S.kana[k]).filter(s=>s&&s.n);
  if(!its.length)return {cls:"na",t:"Noch nicht geübt",n:0};
  const n=groupConf(g);
  if(n>=4)return {cls:"hi",t:"Hohe Gefahr",n};
  if(n>=1)return {cls:"mid",t:"Aufpassen",n};
  return {cls:"lo",t:"Sicher",n};
}

let saveT=null,remote=null,writing=Promise.resolve();
function save(){S.updated=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}clearTimeout(saveT);saveT=setTimeout(pushRemote,2500)}
function pushRemote(){if(!remote)return;const body={json:JSON.stringify(S),updated:S.updated};writing=writing.then(()=>remote.set(body)).then(()=>setSync("In deinem Konto gespeichert")).catch(()=>setSync("Nur lokal gespeichert"))}
function setSync(t){$("#sync").textContent=t}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.doc("data/users/"+id+"/progress");
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej("timeout"),10000))]);
    remote=ref;
    if(snap.exists){const d=snap.data()||{};
      if((d.updated||0)>(S.updated||0)){try{S=merge(JSON.parse(d.json));applyTheme();localStorage.setItem(LS,JSON.stringify(S));if(!SS)render();renderGoalMini()}catch(e){}}
      else if((S.updated||0)>(d.updated||0))pushRemote();
    }else if(S.updated)pushRemote();
    setSync("In deinem Konto gespeichert");
  }catch(e){remote=null}
}

/* ---------- Hilfen ---------- */
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2200)}
const fmtDur=ms=>{const m=Math.round(ms/60000);if(m<60)return m+" min";if(m<2880)return Math.floor(m/60)+" h "+(m%60)+" min";return Math.round(m/1440)+" Tagen"};
const fmtS=ms=>(ms/1000).toFixed(1).replace(".",",")+" s";
const pct=(a,b)=>b?Math.round(a/b*100):0;
function streak(){let n=0,t=Date.now();if(!S.days[dayKey(t)])t-=DAY;while(S.days[dayKey(t)]&&S.days[dayKey(t)].a>0){n++;t-=DAY}return n}
function dueItems(){const now=Date.now();return active().filter(i=>{const s=S.kana[i.k];return s&&s.n&&s.d<=now}).sort((a,b)=>S.kana[a.k].d-S.kana[b.k].d)}
const newItems=()=>active().filter(i=>!S.kana[i.k]||!S.kana[i.k].n);
function weight(i){const s=S.kana[i.k];if(!s||!s.n)return 1.6;let w=1+(1-s.c/s.n)*5;if(s.b<3)w+=1.5;if(s.d<=Date.now())w+=1.5;if(s.st>=5)w*=.6;return w}
function pickItem(pool,recent){const c=pool.filter(i=>!recent.includes(i.k));const list=c.length?c:pool;let tot=0;const ws=list.map(i=>tot+=weight(i));const x=Math.random()*tot;return list[Math.max(0,ws.findIndex(v=>v>=x))]}
function distractors(item,n,restrict){
  let pool=restrict||active();if(!restrict&&pool.length<n+1)pool=ITEMS;
  const cf=(S.kana[item.k]||{}).cf||{};
  const cand=pool.filter(o=>o.k!==item.k&&o.lbl!==item.lbl&&(restrict||o.r!==item.r));
  const sc=cand.map(o=>{let w=Math.random()*2.5;
    if(SIM[item.k]&&SIM[item.k].has(o.k))w+=4;
    if(cf[o.k])w+=3+cf[o.k];
    const rc=(S.kana[o.k]||{}).cf||{};if(rc[item.k])w+=2;
    if(base(o.k)===base(item.k))w+=3;
    if(o.row===item.row)w+=1.2;if(o.v&&o.v===item.v)w+=1;
    if(o.k.length===item.k.length)w+=1.5;
    return [w,o]}).sort((a,b)=>b[0]-a[0]);
  return shuffle(sc.slice(0,restrict?n:7).map(x=>x[1])).slice(0,n);
}

const TYPICAL=[["ぬ","め"],["る","ろ"],["さ","ち"],["は","ほ"],["ね","れ"],["い","り"],["わ","れ"]].filter(p=>BYK[p[0]]&&BYK[p[1]]&&p[0]!==p[1]).map(([a,b])=>({a,b,c:0}));

const LAPS=["var(--accent)","var(--good)","var(--m1)","var(--m2)"];
const lapColor=k=>LAPS[k%LAPS.length];
function ringSVG(a,goal,C){
  const laps=Math.floor(a/goal),rem=a/goal-laps;
  const circ=(stroke,off)=>`<circle cx="52" cy="52" r="44" fill="none" stroke="${stroke}" stroke-width="10" ${off===undefined?"":`stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-off)}"`}/>`;
  if(laps===0)return circ("var(--line)")+(a>0?circ(lapColor(0),rem):"");
  return circ(lapColor(laps-1))+(rem>0?circ(lapColor(laps),rem):"");
}

/* ---------- Sitzung ---------- */
let SS=null;
function drillGroups(){const act=new Set(active().map(i=>i.k));return CONF.map(g=>({g,its:g.k.filter(k=>act.has(k)).map(k=>BYK[k])})).filter(x=>x.its.length>=2)}
function startSession(mode,opts={}){
  const s={mode,pool:opts.pool||active(),idx:0,total:20,right:0,wrong:0,run:0,mist:{},times:[],recent:[],hist:[],start:Date.now(),done:false,locked:false,title:opts.title||""};
  if(mode==="srs"){
    const due=dueItems().slice(0,25),nw=newItems().slice(0,S.settings.newPer);
    const q=due.map(i=>({item:i}));
    nw.forEach((i,n)=>{const pos=Math.min(q.length,n*3);q.splice(pos,0,{item:i,intro:true},{item:i,fresh:true})});
    if(!q.length){toast("Gerade nichts fällig");return}
    s.queue=q;
  }
  if(mode==="weak"){s.pool=active().filter(i=>S.kana[i.k]&&S.kana[i.k].n).sort((a,b)=>{const A=S.kana[a.k],B=S.kana[b.k];return (A.c/A.n-B.c/B.n)||(A.b-B.b)}).slice(0,12)}
  if(mode==="retry")s.total=Math.max(8,s.pool.length*2);
  if(mode==="sprint"){s.total=Infinity;s.end=Date.now()+60000}
  if(mode==="koch"){const ord=kochOrder();s.pool=ord.slice(0,kochLvl());s.total=Infinity;s.ups=[];s.intros=s.pool.filter(i=>!S.kana[i.k]||!S.kana[i.k].n)}
  if(mode==="drill"){
    if(opts.set){const items=opts.set.map(k=>BYK[k]);s.dgroups=[{g:{k:opts.set},its:items}];s.pool=items;s.total=Math.max(12,items.length*4)}
    else{s.dgroups=drillGroups();if(!s.dgroups.length){toast("Keine ähnlichen Zeichen in den aktiven Gruppen");return}s.pool=[...new Set(s.dgroups.flatMap(x=>x.its))]}
  }
  SS=s;
  $$(".view").forEach(el=>el.classList.toggle("on",el.id==="v-session"));
  window.scrollTo(0,0);
  if(mode==="sprint"){s.tick=setInterval(()=>{if(SS!==s)return clearInterval(s.tick);const left=s.end-Date.now();const el=$("#timer");if(el)el.textContent=Math.max(0,Math.ceil(left/1000))+" s";const b=$("#sbar");if(b)b.style.width=Math.max(0,left/600)+"%";if(left<=0){clearInterval(s.tick);finish()}},200)}
  next();
}
const FORMATS={card:{n:"Karteikarte",d:"Aufdecken und selbst bewerten"},type:{n:"Eintippen",d:"Lesung frei eintippen"},mc:{n:"Mehrfachauswahl",d:"Aus 4 Antworten wählen"}};
const modeDir=m=>({k2r:"k2r",r2k:"r2k",listen:"listen"})[m]||"k2r";
/* Effektives Format: Romaji → Kana lässt sich ohne japanische Tastatur nicht eintippen */
const effFmt=dir=>{const f=S.settings.format;return dir==="r2k"&&f==="type"?"mc":f};
function pickDrill(s){
  // Gruppe gewichtet nach eigenen Verwechslungen wählen, dann Zeichen darin
  let tot=0;const ws=s.dgroups.map(x=>tot+=1+groupConf({k:x.its.map(i=>i.k)})*1.5+x.its.reduce((a,i)=>a+(weight(i)-1)*.3,0));
  const x=Math.random()*tot;const grp=s.dgroups[Math.max(0,ws.findIndex(v=>v>=x))];
  const item=pickItem(grp.its,s.recent);
  let opts=grp.its.filter(i=>i.k!==item.k&&i.lbl!==item.lbl);
  if(opts.length>3)opts=distractors(item,3,opts);
  if(opts.length<3){const extra=[...(SIM[item.k]||[])].map(k=>BYK[k]).filter(o=>o&&o.k!==item.k&&!opts.includes(o)&&o.lbl!==item.lbl);opts=opts.concat(shuffle(extra).slice(0,3-opts.length))}
  const sameSound=grp.its.some(o=>o!==item&&o.r===item.r);
  return {item,dir:!sameSound&&Math.random()<.35?"r2k":"k2r",opts:shuffle([item,...opts])};
}
function next(){
  const s=SS;if(!s||s.done)return;
  if(s.mode==="srs"){if(!s.queue.length)return finish()}
  else if(s.idx>=s.total)return finish();
  if(s.mode==="sprint"&&Date.now()>=s.end)return finish();
  let entry;
  if(s.mode==="srs")entry=s.queue.shift();
  else if(s.mode==="drill")entry=pickDrill(s);
  else if(s.mode==="koch")entry=s.intros.length?{item:s.intros.shift(),intro:true}:{item:pickKoch(s)};
  else entry={item:pickItem(s.pool,s.recent)};
  s.cur=entry;s.locked=false;s.waiting=false;s.revealed=false;
  s.recent.push(entry.item.k);if(s.recent.length>Math.min(3,s.pool.length-1))s.recent.shift();
  if(entry.intro)return renderIntro(entry.item);
  if(!entry.dir)entry.dir=modeDir(s.mode);
  entry.fmt=effFmt(entry.dir);
  if(entry.fmt==="mc"&&!entry.opts)entry.opts=shuffle([entry.item,...(s.mode==="koch"?distractors(entry.item,Math.min(3,s.pool.length-1),s.pool):distractors(entry.item,3))]);
  renderQ();
  s.qStart=Date.now();
  if(entry.dir==="listen")say(entry.item.k);
}

function simBoxHTML(){

function renderQ(){
  const s=SS,e=s.cur,i=e.item,d=e.dir,f=e.fmt;

  if(d==="r2k"){tag="Welches Zeichen?";prompt=`<div class="prompt romaji">${esc(i.lbl)}</div>`}

    hint="Wird automatisch geprüft: Sobald deine Eingabe nicht mehr passen kann, zählt sie als Fehler.";

      answer(false,guessPicked(i,raw),raw)};

}

function answer(ok,picked,typed){

/* ---------- Koch-Methode ---------- */
const KOCH_GOAL=.9,KOCH_MS=4000;
const kw=()=>S.settings.kochWin||20;
const VIDX={a:0,i:1,u:2,e:3,o:4,"":5};
const ROWIDX=Object.fromEntries(ROWS.map((r,n)=>[r.id,n]));
const KOCH_ORDERS={row:"Zeilenweise",col:"Spaltenweise",rand:"Zufällig"};
function kochOrder(){
  const act=active(),mode=S.settings.kochOrder||"row";
  if(mode==="col"){const gi={basic:0,daku:1,yoon:2};return act.slice().sort((a,b)=>gi[a.g]-gi[b.g]||VIDX[a.v]-VIDX[b.v]||ROWIDX[a.row]-ROWIDX[b.row])}
  if(mode==="rand"){
    if(!S.koch.perm||S.koch.perm.length!==ITEMS.length)S.koch.perm=shuffle(ITEMS.map(i=>i.k));
    const set=new Set(act.map(i=>i.k));return S.koch.perm.filter(k=>set.has(k)).map(k=>BYK[k]);
  }
  return act;
}
const kochCount=s=>`Stufe ${kochLvl()} · ${s.right+s.wrong} Antworten`;
const kochLvl=()=>Math.max(2,Math.min(S.koch.lvl,kochOrder().length));
function pickKoch(s){
  const newest=s.pool[s.pool.length-1];
  const c=s.pool.filter(i=>!s.recent.includes(i.k));const list=c.length?c:s.pool;
  let tot=0;const ws=list.map(i=>tot+=weight(i)*(i===newest?2.5:1));const x=Math.random()*tot;
  return list[Math.max(0,ws.findIndex(v=>v>=x))];
}
function kochCard(){
  const ord=kochOrder(),lvl=kochLvl(),w=S.koch.win,acc=w.length?w.reduce((a,b)=>a+b,0)/w.length:0;
  const msg=w.length<kw()?`Noch ${kw()-w.length} Antworten bis zur nächsten Prüfung.`:acc>=KOCH_GOAL?"Ziel erreicht.":`Ziel: 90 % der letzten ${kw()} Antworten. Bleib dran.`;
  return `<div class="card"><div class="sec-title" style="margin-bottom:10px"><h3>Koch-Methode</h3><span class="pill ac num">Stufe ${lvl} / ${ord.length}</span></div>
    <div class="kochpool">${ord.slice(0,lvl).map((i,n)=>`<span class="kana ${n===lvl-1?"new":""}" title="${esc(i.lbl)}">${i.k}</span>`).join("")}</div>
    <div class="sec-title small" style="margin-top:12px"><span>Schnell und richtig (letzte ${w.length})</span><b class="num">${pct(acc*w.length,w.length)} %</b></div>
    <div class="kbar"><i style="width:${acc*100}%;background:${acc>=KOCH_GOAL?"var(--good)":"var(--accent)"}"></i><span style="left:${KOCH_GOAL*100}%"></span></div>
    <div class="muted" style="font-size:12px;margin-top:8px">${msg} Antworten über ${KOCH_MS/1000} s zählen nicht.</div></div>`;
}
function kochUpdate(s,ok,ms){
  const K=S.koch;K.win.push(ok&&ms<KOCH_MS?1:0);while(K.win.length>kw())K.win.shift();
  const ord=kochOrder(),lvl=kochLvl(),acc=K.win.reduce((a,b)=>a+b,0)/K.win.length;
  if(K.win.length>=kw()&&acc>=KOCH_GOAL&&lvl<ord.length){
    K.lvl=lvl+1;K.win=[];const it=ord[lvl];s.pool=ord.slice(0,K.lvl);s.intros.push(it);s.ups.push(it.k);
    toast(`Stufe ${K.lvl}: ${it.k} (${it.lbl}) kommt dazu`);
  }
  save();
}

/* ---------- Umschrift ---------- */
const ROMA=(()=>{const m={};ITEMS.forEach(i=>m[i.k]=i.r);Object.assign(m,{"ぁ":"a","ぃ":"i","ぅ":"u","ぇ":"e","ぉ":"o","ゃ":"ya","ゅ":"yu","ょ":"yo","ゎ":"wa","ゔ":"vu","ゐ":"i","ゑ":"e","ゕ":"ka","ゖ":"ke",
 "ふぁ":"fa","ふぃ":"fi","ふぇ":"fe","ふぉ":"fo","ふゅ":"fyu","てぃ":"ti","でぃ":"di","とぅ":"tu","どぅ":"du","てゅ":"tyu","でゅ":"dyu","ちぇ":"che","しぇ":"she","じぇ":"je",
 "うぃ":"wi","うぇ":"we","うぉ":"wo","ゔぁ":"va","ゔぃ":"vi","ゔぇ":"ve","ゔぉ":"vo","つぁ":"tsa","つぃ":"tsi","つぇ":"tse","つぉ":"tso","いぇ":"ye","ぢゃ":"ja","ぢゅ":"ju","ぢょ":"jo","くぁ":"kwa","ぐぁ":"gwa"});return m})();
const PUNCT={"。":". ","、":", ","「":"\"","」":"\"","『":"\"","』":"\"","・":" ","〜":"~","…":"...","〈":"<","〉":">","【":"[","】":"]"};
const MAC={a:"ā",i:"ī",u:"ū",e:"ē",o:"ō"};
const toH=c=>{const x=c.codePointAt(0);return x>=0x30A1&&x<=0x30F6?String.fromCodePoint(x-0x60):c};
const hstr=s=>[...s].map(toH).join("");
function translit(text,opt){
  const ch=[...text.normalize("NFKC")],T=[];let i=0;
  while(i<ch.length){
    const c=ch[i],h=toH(c);
    if(h==="っ"){T.push({src:c,rom:"",kind:"kana",sok:true});i++;continue}
    if(h==="ー"){T.push({src:c,rom:"",kind:"kana",long:true});i++;continue}
    if(i+1<ch.length&&ROMA[h+toH(ch[i+1])]&&/[ぁぃぅぇぉゃゅょゎ]/.test(toH(ch[i+1]))){T.push({src:c+ch[i+1],rom:ROMA[h+toH(ch[i+1])],kind:"kana"});i+=2;continue}
    if(ROMA[h]!==undefined){T.push({src:c,rom:ROMA[h],kind:"kana"});i++;continue}
    if(c==="\n"){T.push({src:c,rom:"\n",kind:"nl"});i++;continue}
    if(/\s/.test(c)){T.push({src:c,rom:" ",kind:"space"});i++;continue}
    if(PUNCT[c]!==undefined||/[.,!?;:()"'~\-]/.test(c)){T.push({src:c,rom:PUNCT[c]!==undefined?PUNCT[c]:c,kind:"punct"});i++;continue}
    if(/[㐀-鿿豈-﫿々〆]/.test(c)){T.push({src:c,rom:c,kind:"kanji"});i++;continue}
    T.push({src:c,rom:c,kind:"other"});i++;
  }
  const isK=t=>t&&t.kind==="kana";
  const edge=t=>!t||t.kind==="space"||t.kind==="nl"||t.kind==="punct";
  T.forEach((t,j)=>{
    if(!isK(t))return;
    const h=hstr(t.src),nx=T[j+1],pv=T[j-1];
    if(opt.particles&&t.src==="を")t.rom="o";
    if(opt.particles&&(t.src==="は"||t.src==="へ")&&edge(pv)&&edge(nx)&&pv&&pv.kind!=="nl"){t.rom=t.src==="は"?"wa":"e";t.part=true}
    if(h==="ん"&&isK(nx)&&/^[aiueoy]/.test(nx.rom))t.rom="n'";
  });
  T.forEach((t,j)=>{
    if(t.sok){const nx=T[j+1];t.rom=isK(nx)&&/^[bcdfghjkmpqrstvwxz]/.test(nx.rom)?(nx.rom.startsWith("ch")?"t":nx.rom[0]):""}
  });
  T.forEach((t,j)=>{
    if(!isK(t))return;
    const pv=T[j-1];
    if(t.long){const v=isK(pv)?pv.rom.slice(-1):"";if("aiueo".includes(v)&&v){if(opt.macron){pv.rom=pv.rom.slice(0,-1)+MAC[v];t.rom=""}else t.rom=v}else t.rom="-";return}
    if(opt.macron&&isK(pv)&&!pv.part&&t.src.length===1&&!t.part){
      const h=toH(t.src),v=pv.rom.slice(-1);
      if((v==="o"&&(h==="う"||h==="お"))||(v==="u"&&h==="う")||(v==="a"&&h==="あ")||(v==="e"&&h==="え")){pv.rom=pv.rom.slice(0,-1)+MAC[v];t.rom="";t.merged=true}
    }
  });
  const out=T.map(t=>t.rom).join("").split("\n").map(l=>l.replace(/ +/g," ").replace(/ ([.,!?])/g,"$1").trim()).join("\n");
  return {T,out};
}

const G={"は":"Themenpartikel (gelesen wa)","が":"Subjektpartikel","を":"Objektpartikel (gelesen o)","に":"Partikel: in, an, zu","へ":"Partikel: nach, zu (gelesen e)","で":"Partikel: in, mit, durch","の":"Partikel: von, -s / macht Verben zu Nomen","と":"und, mit / markiert ein Zitat","も":"auch","から":"seit, von","まで":"bis","な":"Ausruf / verbindet na-Adjektive","よね":"…, nicht wahr?",

function isPrefix(raw,targets){const v=normR(raw);if(targets.some(t=>t.startsWith(v)))return true;return "aiueo".split("").some(x=>{const w=normR(raw+x);return targets.some(t=>t.startsWith(w))})}

function guessPicked(item,raw){
  const v=normR(raw);
  if(v!=="n"){const ex=ITEMS.find(o=>o.k!==item.k&&accepts(o).map(normR).includes(v));if(ex)return ex.k}
  const sims=[...(SIM[item.k]||[])].map(k=>BYK[k]).filter(o=>o&&accepts(o).some(a=>normR(a).startsWith(v)));
  if(sims.length===1)return sims[0].k;
  const cf=(S.kana[item.k]||{}).cf||{};const known=sims.filter(o=>cf[o.k]).sort((a,b)=>cf[b.k]-cf[a.k]);
  return known.length?known[0].k:null;
}
/* Tippfehler oder echter Fehler?
   Tippfehler: Eingabe ist gar keine mögliche Silbe (z. B. "kk", "q"), oder die Form passt nicht:
   Konsonant getippt, obwohl die Lösung ein reiner Vokal ist, bzw. Vokal getippt, obwohl die Lösung mit Konsonant beginnt.
   Echter Fehler: eine gültige Silbe gleicher Form mit falschem Konsonanten oder Vokal (z. B. "ki" statt "ka", "ga" statt "ka"). */

const isV=c=>"aiueo".includes(c);
function typoReason(raw,ansRom){
  const v=normR(raw),a=normR(ansRom);if(!v)return null;
  const ansVowel=a.length===1&&isV(a);
  if(ansVowel&&!isV(v[0]))return `Die Lösung ist ein reiner Vokal, du hast mit „${raw[0]}“ begonnen.`;
  if(!ansVowel&&isV(v[0]))return `Die Lösung beginnt mit einem Konsonanten, du hast mit „${raw[0]}“ begonnen.`;
  if(!isPrefix(raw,ALLT))return `„${raw}“ ergibt keine gültige Silbe.`;
  return null;
}
function wordTypo(raw,w){
  const tgt=normR(w.rom),inp=normR(raw);let m=0;while(m<tgt.length&&inp[m]===tgt[m])m++;
  let acc=0;for(const t of w.syl){const r=normR(t.rom),st=acc;acc+=r.length;
    if(acc>m||t===w.syl[w.syl.length-1]){
      if(t.sok||t.long||!r)return null;              // fehlendes っ oder ー: echter Lesefehler
      const frag=inp.slice(st);if(!frag)return null;
      return typoReason(frag,r);
    }}
  return null;
}

const PREP={};
function prep(st){
  if(PREP[st.id])return PREP[st.id];
  const sents=st.s.map(([jp,de])=>{
    const {T}=translit(jp,{particles:true,macron:false});const parts=[];let cur=null;
    T.forEach(t=>{
      if(t.kind==="kana"){if(!cur){cur={type:"w",syl:[]};parts.push(cur)}cur.syl.push(t)}
      else{cur=null;if(t.kind!=="space")parts.push({type:"p",src:t.src})}
    });
    parts.filter(p=>p.type==="w").forEach(w=>{
      w.kana=w.syl.map(t=>t.src).join("");
      w.rom=w.syl.map(t=>t.rom).join("");
      w.alt=w.syl.map(t=>t.part?(t.src==="は"?"ha":"he"):t.src==="を"?"wo":t.rom).join("");
      w.gloss=st.g[w.kana]||G[w.kana]||"";
    });
    return {jp,de,parts,words:parts.filter(p=>p.type==="w")};
  });
  const kana=[...new Set(sents.flatMap(s=>s.words.flatMap(w=>w.syl.map(t=>hstr(t.src)).filter(k=>BYK[k]))))];
  const syl=sents.reduce((a,s)=>a+s.words.reduce((b,w)=>b+w.syl.length,0),0);
  return PREP[st.id]={sents,kana,syl,words:sents.reduce((a,s)=>a+s.words.length,0)};
}

function readAnswer(ok,typed){
  const T=RD.t,P=prep(stOf());if(!T||T.done)return;
  const w=P.sents[T.si].words[T.wi],ms=Date.now()-T.qStart;
  T.res[T.si+"-"+T.wi]={ok};T.last={w,ok,typed};
  const per=ms/Math.max(1,w.syl.length);
  if(ok){T.ok++;T.sylDone+=w.syl.length;w.syl.forEach(t=>{const h=hstr(t.src);if(BYK[h])record(BYK[h],true,per,null,"quiz")})}
  else{
    T.bad++;
    // Fehlerhafte Silbe über den ersten abweichenden Buchstaben finden
    const tgt=normR(w.rom),inp=normR(typed);let m=0;while(m<tgt.length&&inp[m]===tgt[m])m++;
    let acc=0,bad=w.syl[w.syl.length-1];for(const t of w.syl){acc+=normR(t.rom).length;if(acc>m){bad=t;break}}
    const h=hstr(bad.src);if(BYK[h]&&!bad.part&&bad.src!=="を"){record(BYK[h],false,ms,null,"quiz");T.mist[h]=(T.mist[h]||0)+1}
  }
  T.n++;T.wi++;
  if(T.wi>=P.sents[T.si].words.length){T.si++;T.wi=0}
  T.qStart=Date.now();
  if(!ok&&T.si<P.sents.length){T.pause=true;renderReader();setTimeout(()=>{if(RD.t!==T)return;T.pause=false;T.qStart=Date.now();renderReader()},1300);return}
  if(T.si>=P.sents.length){
    T.done=true;T.end=Date.now();
    const st=stOf(),acc=pct(T.ok,T.ok+T.bad),spd=Math.round(T.sylDone/Math.max((T.end-T.start)/60000,1/60));
    S.stories=S.stories||{};const r=S.stories[st.id]||{reads:0,best:0,speed:0};
    r.reads++;r.best=Math.max(r.best,acc);r.speed=Math.max(r.speed,spd);r.last=Date.now();S.stories[st.id]=r;save();
    T.acc=acc;T.spd=spd;
    renderLesen();return;
  }
  renderReader();
}

function placeLvPop(w){

  const r=btn.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,m=8,wd=pop.offsetWidth,h=pop.offsetHeight;

  const below=vh-m-(r.bottom+6),above=r.top-6-m;

  pop.style.left=left+"px";pop.style.top=top+"px";

    <div class="kv"><div><b>${LEVELS[level(k)]}</b><span>Status (Stufe ${s.b} von 6)</span></div><div><b class="num">${s.n?pct(s.c,s.n)+" %":"–"}</b><span>Trefferquote · ${s.n}× geübt</span></div><div><b class="num">${s.c?fmtS(s.ms/s.c):"–"}</b><span>Ø Reaktionszeit</span></div><div><b>${due}</b><span>Nächste Wiederholung</span></div></div>
    ${cf.length?`<div><h3 style="margin-bottom:8px">Von dir verwechselt mit</h3><div class="mistakes">${cf.map(([o,c])=>`<button class="mk" style="border:0" data-pa="${k}" data-pb="${o}"><span class="kana">${o}</span>${esc(BYK[o].lbl)} <small>×${c}</small></button>`).join("")}</div></div>`:""}
    ${sims.length?`<div><h3 style="margin-bottom:10px">Verwechslungsgefahr</h3><div class="tiplist">${sims.slice(0,6).map(o=>`<div class="tip"><span class="pk">${k}<em>/</em>${o}</span><span>${esc(pairTip(k,o)||`${o} = ${BYK[o].lbl}`)}</span></div>`).join("")}</div></div>
    <button class="btn primary sm" id="dDrill" style="align-self:flex-start">Mit ähnlichen Zeichen üben</button>`:""}`);
  const d=$("#dsp");if(d)d.onclick=()=>say(k);
  bindPairs($("#dlg"));
  const dd=$("#dDrill");if(dd)dd.onclick=()=>{closeModal();startSession("drill",{set:[k,...sims.slice(0,5)],title:k})};
}

/* ---------- Statistik ---------- */
function renderStats(){
  const all=ITEMS,act=active();
  const tot=Object.values(S.kana).reduce((a,s)=>({n:a.n+s.n,c:a.c+s.c,ms:a.ms+s.ms}),{n:0,c:0,ms:0});
  const lv=[0,0,0,0];act.forEach(i=>lv[level(i.k)]++);
  const best=Object.values(S.days).reduce((m,d)=>Math.max(m,d.a),0);
  const cp=confusionPairs().filter(x=>BYK[x.a]&&BYK[x.b]);
  const totalConf=cp.reduce((a,p)=>a+p.c,0),wrongTotal=tot.n-tot.c;
  const days=[];for(let n=29;n>=0;n--){const t=Date.now()-n*DAY;days.push({d:new Date(t),v:S.days[dayKey(t)]||{a:0,c:0}})}
  const goal=S.settings.goal,nice=Math.ceil(Math.max(10,goal,...days.map(d=>d.v.a))/10)*10;
  const W=900,H=200,pl=34,pb=24,pt=10,bw=(W-pl-6)/30;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Antworten pro Tag, letzte 30 Tage">`;
  [0,.5,1].forEach(f=>{const y=pt+(H-pt-pb)*(1-f);svg+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(nice*f)}</text>`});
  days.forEach((d,n)=>{const h=(H-pt-pb)*d.v.a/nice,x=pl+n*bw+2,y=H-pb-h,accR=d.v.a?d.v.c/d.v.a:0;
    if(d.v.a){
      // Balken in Runden zum Tagesziel aufteilen, jede Runde in der Farbe des Tagesziel-Kreises
      let g="",from=0,k=0;const sc=(H-pt-pb)/nice;
      while(from<d.v.a){const to=Math.min(d.v.a,from+goal),y0=H-pb-to*sc,hh=(to-from)*sc;g+=`<rect x="${x}" y="${y0}" width="${bw-4}" height="${Math.max(hh,1)}" rx="${to===d.v.a?3:0}" fill="${lapColor(k)}"/>`;from=to;k++}
      svg+=`<g><title>${d.d.toLocaleDateString("de-DE")}: ${d.v.a} Antworten (${(d.v.a/goal).toFixed(1).replace(".",",")}× Tagesziel), ${pct(d.v.c,d.v.a)} % richtig</title>${g}</g>`;
    }else svg+=`<rect x="${x}" y="${H-pb-2}" width="${bw-4}" height="2" rx="1" fill="var(--line)"/>`;
    if(n%7===1||n===29)svg+=`<text x="${x+(bw-4)/2}" y="${H-6}" text-anchor="middle">${n===29?"heute":d.d.getDate()+"."+(d.d.getMonth()+1)+"."}</text>`});
  {const gy=pt+(H-pt-pb)*(1-goal/nice);svg+=`<line x1="${pl}" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--ink)" stroke-opacity=".45" stroke-dasharray="4 4"/><text x="${pl+6}" y="${gy-5}" text-anchor="start">Tagesziel ${goal}</text>`}
  svg+="</svg>";
  const weak=all.filter(i=>S.kana[i.k]&&S.kana[i.k].n>=2).map(i=>({i,s:S.kana[i.k],acc:S.kana[i.k].c/S.kana[i.k].n})).sort((a,b)=>a.acc-b.acc||b.s.n-a.s.n).slice(0,6);
  const slow=all.filter(i=>S.kana[i.k]&&S.kana[i.k].c>=2).map(i=>({i,t:S.kana[i.k].ms/S.kana[i.k].c})).sort((a,b)=>b.t-a.t).slice(0,6);
  const rowStats=ROWS.map(r=>{const a=ITEMS.filter(i=>i.row===r.id).reduce((x,i)=>{const s=S.kana[i.k];return s?{n:x.n+s.n,c:x.c+s.c}:x},{n:0,c:0});return {r,a}}).filter(x=>x.a.n>0);
  const accCol=a=>a>=.9?"var(--m3)":a>=.75?"var(--m2)":a>=.5?"var(--m1)":"var(--bad)";
  const heat=all.filter(i=>S.kana[i.k]&&S.kana[i.k].n).map(i=>{const s=S.kana[i.k],a=s.c/s.n;return `<div class="hc kana" title="${i.k} ${esc(i.lbl)}: ${pct(s.c,s.n)} % bei ${s.n} Versuchen" style="background:color-mix(in srgb,${accCol(a)} ${Math.round(18+40*Math.min(1,s.n/10))}%,var(--surface))">${i.k}</div>`}).join("");
  const grpRisk=CONF.map(g=>({g,n:groupConf(g)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,6);
  const maxG=Math.max(1,...grpRisk.map(x=>x.n));
  const empty=t=>`<div class="empty-note">${t}</div>`;
  $("#v-statistik").innerHTML=`<div class="stack">
    <div class="sec-title"><h2>Statistik</h2><span class="muted small">${S.sessions} Sitzungen abgeschlossen</span></div>
    <div class="stat-tiles">
      <div class="tile"><b class="num">${tot.n}</b><span>Antworten gesamt</span></div>
      <div class="tile"><b class="num">${tot.n?pct(tot.c,tot.n)+" %":"–"}</b><span>Trefferquote${S.typos?` · ${S.typos} Tippfehler nicht gewertet`:""}</span></div>
      <div class="tile"><b class="num">${fmtDur(S.totalMs)}</b><span>Reine Antwortzeit</span></div>
      <div class="tile"><b class="num">${streak()}</b><span>Tage in Folge</span></div>
      <div class="tile"><b class="num">${tot.c?fmtS(tot.ms/tot.c):"–"}</b><span>Ø Reaktionszeit</span></div>
      <div class="tile"><b class="num">${wrongTotal?pct(totalConf,wrongTotal)+" %":"–"}</b><span>Fehler durch Verwechslung</span></div>
    </div>
    <div class="srow">
      <div class="card stack chart" style="gap:10px"><div class="sec-title"><h3>Aktivität, letzte 30 Tage</h3><span class="muted small">Bester Tag: ${best} Antworten · Farben wie beim Tagesziel-Kreis, jede volle Runde eine neue Farbe</span></div>${svg}</div>
      <div class="card stack" style="gap:12px">
        <div class="sec-title"><h3>Lernfortschritt</h3><span class="muted num small">${pct(lv[3],act.length)} % beherrscht</span></div>
        <div class="stack-bar" style="height:14px">${[1,2,3].map(n=>`<i style="width:${lv[n]/act.length*100}%;background:var(--m${n})" title="${LEVELS[n]}: ${lv[n]}"></i>`).join("")}</div>
        <div class="lv4">${LEVELS.map((l,n)=>`<div class="lvi"><i style="width:10px;height:10px;border-radius:3px;background:var(--m${n})"></i><span>${l}</span><b class="num">${lv[n]}</b></div>`).join("")}</div>
        <div class="muted" style="font-size:12px;margin-top:auto">Beherrscht heißt: über mehrere Tage hinweg richtig gelesen (Wiederholungsabstand ab 3 Tagen). Gilt für die aktiven Gruppen.</div>
      </div>
    </div>
    <div class="masonry">
      <div class="card"><div class="sec-title" style="margin-bottom:8px"><h3>Häufige Verwechslungen</h3>${cp.length?`<button class="btn ghost sm" data-goto="aehnlich">Details</button>`:""}</div><div class="list">${cp.length?cp.slice(0,6).map(p=>`<button class="li pairrow" data-pa="${p.a}" data-pb="${p.b}" style="grid-template-columns:96px 1fr auto"><span class="pk" style="font-size:24px">${p.a}<em>↔</em>${p.b}</span><span class="muted small">${esc(BYK[p.a].lbl)} / ${esc(BYK[p.b].lbl)}</span><b class="num">${p.c}×</b></button>`).join(""):empty("Noch keine Verwechslungen erfasst.")}</div></div>
      <div class="card"><h3 style="margin-bottom:8px">Schwächste Zeichen</h3><div class="list">${weak.length?weak.map(w=>`<div class="li"><span class="kana">${w.i.k}</span><div><b>${esc(w.i.lbl)}</b> <span class="muted" style="font-size:12.5px">· ${w.s.n}× geübt</span><div class="mini"><i style="width:${w.acc*100}%;background:${accCol(w.acc)}"></i></div></div><b class="num">${Math.round(w.acc*100)} %</b></div>`).join(""):empty("Noch zu wenige Daten. Übe ein paar Runden.")}</div></div>
      <div class="card"><h3 style="margin-bottom:12px">Gefährlichste Gruppen</h3>${grpRisk.length?grpRisk.map(x=>`<div class="rowacc" style="grid-template-columns:110px 1fr 36px"><span class="kana">${x.g.k.slice(0,4).join(" ")}</span><div class="mini" style="margin:0"><i style="width:${x.n/maxG*100}%;background:var(--bad)"></i></div><b class="num" style="text-align:right">${x.n}×</b></div>`).join(""):empty("Noch keine Verwechslungen innerhalb der Gruppen.")}</div>
      <div class="card"><h3 style="margin-bottom:12px">Trefferquote nach Reihe</h3>${rowStats.length?rowStats.map(x=>{const a=x.a.c/x.a.n;return `<div class="rowacc"><span class="kana">${rowName(x.r.id)}</span><div class="mini" style="margin:0"><i style="width:${a*100}%;background:${accCol(a)}"></i></div><b class="num" style="text-align:right">${Math.round(a*100)} %</b></div>`}).join(""):empty("Noch keine Daten.")}</div>
      <div class="card"><h3 style="margin-bottom:8px">Langsamste Zeichen</h3><div class="list">${slow.length?slow.map(w=>`<div class="li"><span class="kana">${w.i.k}</span><b>${esc(w.i.lbl)}</b><b class="num">${fmtS(w.t)}</b></div>`).join(""):empty("Noch zu wenige Daten.")}</div></div>
    </div>
    <div class="card stack" style="gap:12px"><h3>Trefferquote pro Zeichen</h3>${heat?`<div class="heat">${heat}</div><div class="legend"><span><i style="background:var(--bad)"></i>unter 50 %</span><span><i style="background:var(--m1)"></i>50–74 %</span><span><i style="background:var(--m2)"></i>75–89 %</span><span><i style="background:var(--m3)"></i>ab 90 %</span><span>Farbstärke = Anzahl Versuche</span></div>`:empty("Noch keine Zeichen geübt.")}</div>
    <div><button class="btn ghost" id="reset" style="color:var(--bad)">Fortschritt zurücksetzen</button></div>
  </div>`;
  $("#reset").onclick=confirmReset;
  bindPairs($("#v-statistik"));
  $$("#v-statistik [data-goto]").forEach(b=>b.onclick=()=>go(b.dataset.goto));
}
function confirmReset(){
  openModal(`<div class="dlg-head"><h3>Fortschritt zurücksetzen?</h3><button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
  <p style="margin:0" class="muted">Alle Statistiken, Wiederholungsstufen, Verwechslungen und Rekorde werden gelöscht. Deine Einstellungen bleiben erhalten. Das lässt sich nicht rückgängig machen.</p>
  <div class="row-btns" style="justify-content:flex-end"><button class="btn ghost" data-close>Abbrechen</button><button class="btn danger" id="doReset">Endgültig zurücksetzen</button></div>`);
  $("#doReset").onclick=()=>{const st=S.settings;S=fresh();S.settings=st;save();closeModal();render();toast("Fortschritt zurückgesetzt")};
}

/* ---------- Einstellungen ---------- */
function openSettings(){
  const st=S.settings;
  const seg=(key,vals)=>`<div class="seg" data-key="${key}">${vals.map(v=>`<button data-v="${v}" aria-pressed="${st[key]===v}">${v}</button>`).join("")}</div>`;
  openModal(`<div class="dlg-head"><h3 style="display:flex;align-items:center;gap:10px"><span style="color:var(--accent);display:inline-flex"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>Einstellungen</h3><button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
    <div class="setgrid"><div class="setcol"><h4>Allgemein</h4>
    <div class="field"><label>Darstellung</label><div class="seg" id="themeSeg">${[["auto","System"],["light","Hell"],["dark","Dunkel"]].map(([v,l])=>`<button data-theme-v="${v}" aria-pressed="${(st.theme||"auto")===v}">${l}</button>`).join("")}</div></div>
    <div class="field"><label for="goalRange" class="sec-title"><span>Tagesziel (Antworten)</span><b class="num" id="goalVal">${st.goal}</b></label><input type="range" id="goalRange" min="10" max="150" step="5" value="${Math.min(150,st.goal)}"><div class="sec-title muted" style="font-size:11.5px"><span>10</span><span>150</span></div></div>
    <div class="switch"><div><b style="font-size:13.5px">Intro beim Start zeigen</b><div class="muted" style="font-size:12.5px">Kurze Animation beim Öffnen, mit Klick oder Taste überspringbar</div></div><span style="display:flex;gap:10px;align-items:center"><button class="btn ghost sm" id="introPlay">Abspielen</button><input type="checkbox" id="introOn" ${st.intro!==false?"checked":""}></span></div>
    <div class="field"><label>Neue Zeichen pro Lernsitzung</label>${seg("newPer",[3,5,8,10])}</div>
    <div class="switch"><div><b style="font-size:13.5px">Aussprache automatisch abspielen</b><div class="muted" style="font-size:12.5px">${canSpeak()?"Nach jeder Antwort und bei neuen Zeichen":"In diesem Browser ist keine japanische Stimme verfügbar"}</div></div><input type="checkbox" id="autoSpeak" ${st.autoSpeak?"checked":""} ${canSpeak()?"":"disabled"}></div>
    </div><div class="setcol"><h4>Koch-Methode</h4>
    <div class="field"><label class="sec-title"><span>Reihenfolge der Zeichen</span><span class="muted" style="font-weight:500;font-size:12px">Stufe ${kochLvl()} von ${kochOrder().length}</span></label>
      <div class="seg" id="kochSeg">${Object.entries(KOCH_ORDERS).map(([v,l])=>`<button data-ko="${v}" aria-pressed="${(st.kochOrder||"row")===v}">${l}</button>`).join("")}</div>
      <div class="kochprev kana" id="kochPrev"></div>
      <div class="sec-title"><span class="muted" style="font-size:12px">Deine Stufe bleibt beim Wechsel erhalten. Freigeschaltet sind die ersten Zeichen der neuen Reihenfolge.</span><span style="display:flex;gap:6px">${(st.kochOrder||"row")==="rand"?`<button class="btn ghost sm" id="kochShuffle">Neu mischen</button>`:""}<button class="btn ghost sm" id="kochReset">Auf Stufe 2 zurücksetzen</button></span></div></div>
    <div class="field"><label class="sec-title"><span>Antworten bis zur Prüfung</span><span class="muted" style="font-weight:500;font-size:12px">Aufstieg ab 90 % schnell und richtig</span></label>${seg("kochWin",[5,10,15,20,25])}
      <span class="muted" style="font-size:12px">So viele Antworten werden gesammelt, bevor über die nächste Stufe entschieden wird. Bei 5 heißt das: alle 5 schnell und richtig.</span></div>
    </div></div>
    <div class="switch" style="border-top:1px solid var(--line);padding-top:14px"><div><b style="font-size:13.5px">Fortschritt übertragen</b><div class="muted" style="font-size:12.5px">Lernstand als Text kopieren und in einer anderen Version des Trainers (z. B. auf GitHub) wieder einfügen</div></div><span style="display:flex;gap:8px;flex:none"><button class="btn ghost sm" id="bkCopy">Kopieren</button><button class="btn ghost sm" id="bkPaste">Einfügen</button></span></div>
    <div class="muted" style="font-size:12.5px;border-top:1px solid var(--line);padding-top:12px">Die Lernsitzung nutzt verteilte Wiederholung: Richtig gelesene Zeichen kommen in wachsenden Abständen wieder (10 min, 1 h, 1 Tag, 3 Tage, 1 Woche, 3 Wochen), Fehler setzen den Abstand zurück. Falsche Antwortoptionen werden bevorzugt aus ähnlichen und von dir bereits verwechselten Zeichen gewählt.</div>`,"wide");
  $$("#dlg .seg").forEach(sg=>$$("button",sg).forEach(b=>b.onclick=()=>{S.settings[sg.dataset.key]=+b.dataset.v;save();$$("button",sg).forEach(x=>x.setAttribute("aria-pressed",x===b));renderGoalMini();if(!SS)render()}));
  $$("#dlg .seg[data-key=kochWin] button").forEach(b=>b.addEventListener("click",()=>{while(S.koch.win.length>kw())S.koch.win.shift();save()}));
  $("#bkCopy").onclick=async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);toast("Lernstand kopiert")}catch(e){openModal(`<div class="dlg-head"><h3>Lernstand kopieren</h3><button class="icon-btn" data-close aria-label="Schließen">✕</button></div><p class="muted small" style="margin:0">Das automatische Kopieren wurde blockiert. Markiere den Text und kopiere ihn selbst.</p><textarea id="bkTxt" class="bktxt" readonly>${esc(t)}</textarea>`);const ta=$("#bkTxt");ta.focus();ta.select()}};
  $("#bkPaste").onclick=()=>{openModal(`<div class="dlg-head"><h3>Lernstand einfügen</h3><button class="icon-btn" data-close aria-label="Schließen">✕</button></div><p class="muted small" style="margin:0">Füge hier den kopierten Text ein. Dein aktueller Lernstand auf diesem Gerät wird dabei ersetzt.</p><textarea id="bkTxt" class="bktxt" placeholder="{&quot;v&quot;:1, …}"></textarea><div class="row-btns" style="justify-content:flex-end"><button class="btn ghost" data-close>Abbrechen</button><button class="btn primary" id="bkDo">Ersetzen</button></div>`);
    $("#bkDo").onclick=()=>{try{const o=JSON.parse($("#bkTxt").value.trim());if(!o||typeof o!=="object"||!o.kana||!o.settings)throw 0;S=merge(o);save();applyTheme();closeModal();render();renderGoalMini();toast("Lernstand übernommen")}catch(e){toast("Das ist kein gültiger Lernstand.")}}};
  $("#introOn").onchange=e=>{S.settings.intro=e.target.checked;save()};
  $("#introPlay").onclick=()=>{closeModal();playIntro()};
  $("#autoSpeak").onchange=e=>{S.settings.autoSpeak=e.target.checked;save()};
  $$("#themeSeg button").forEach(b=>b.onclick=()=>{S.settings.theme=b.dataset.themeV;save();applyTheme();$$("#themeSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  const gr=$("#goalRange");
  gr.oninput=()=>{S.settings.goal=+gr.value;$("#goalVal").textContent=gr.value;renderGoalMini();if(!SS&&cur==="ueben")renderHome()};
  gr.onchange=()=>save();
  const kp=()=>{const o=kochOrder(),l=kochLvl();$("#kochPrev").innerHTML=o.slice(0,16).map((i,n)=>`<span class="${n<l?"on":""}" title="${esc(i.lbl)}">${i.k}</span>`).join("")+(o.length>16?`<span class="more">…</span>`:"")};kp();
  $$("#kochSeg button").forEach(b=>b.onclick=()=>{const v=b.dataset.ko;if(v==="rand"&&S.settings.kochOrder!=="rand")S.koch.perm=null;S.settings.kochOrder=v;save();openSettings()});
  const ksh=$("#kochShuffle");if(ksh)ksh.onclick=()=>{S.koch.perm=null;kochOrder();save();kp();toast("Reihenfolge neu gemischt")};
  $("#kochReset").onclick=()=>{S.koch={lvl:2,win:[]};save();toast("Koch-Methode startet wieder bei Stufe 2");if(!SS)render()};
}
$("#openSettings").onclick=openSettings;

/* ---------- Dialog ---------- */
let lastFocus=null;
function openModal(html,cls){lastFocus=document.activeElement;$("#dlg").className="dlg"+(cls?" "+cls:"");$("#dlg").innerHTML=html;$("#modal").classList.add("on");$$("[data-close]",$("#dlg")).forEach(b=>b.onclick=closeModal);const f=$("#dlg button");if(f)f.focus()}
function closeModal(){$("#modal").classList.remove("on");if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus()}
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};

/* ---------- Tastatur ---------- */
document.addEventListener("keydown",e=>{
  if($("#modal").classList.contains("on")){if(e.key==="Escape")closeModal();return}
  if(SS&&!SS.done){
    if(e.key==="Escape"){finish();return}
    if(SS.waiting&&e.key==="Enter"){e.preventDefault();SS.waiting=false;next();return}
    const c=SS.cur;if(!c||c.intro||SS.locked)return;
    if(c.dir==="listen"&&e.key===" "&&!SS.revealed){e.preventDefault();say(c.item.k);return}
    if(c.fmt==="card"){
      if(!SS.revealed&&(e.key===" "||e.key==="Enter")){e.preventDefault();flip()}
      else if(SS.revealed&&(e.key==="1"||e.key==="ArrowLeft")){e.preventDefault();answer(false,null)}
      else if(SS.revealed&&(e.key==="2"||e.key==="ArrowRight")){e.preventDefault();answer(true,null)}
    }else if(c.fmt==="mc"&&/^[1-4]$/.test(e.key)){const b=$$(".opt")[+e.key-1];if(b)b.click()}
    return;
  }
  if(cur==="ueben"&&!SS&&e.key==="Enter"&&document.activeElement===document.body){const b=$("#startSrs");if(b){e.preventDefault();b.click()}}
});

/* ---------- Start ---------- */
/* Hell/Dunkel: "auto" übernimmt, was die Umgebung bzw. das System vorgibt */
const HOST_THEME=document.documentElement.getAttribute("data-theme");
function applyTheme(){const t=S.settings.theme||"auto",r=document.documentElement;if(t==="auto"){if(HOST_THEME)r.setAttribute("data-theme",HOST_THEME);else r.removeAttribute("data-theme")}else r.setAttribute("data-theme",t)}
applyTheme();
try{new MutationObserver(()=>{const t=S.settings.theme||"auto",r=document.documentElement;if(t!=="auto"&&r.getAttribute("data-theme")!==t)r.setAttribute("data-theme",t)}).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]})}catch(e){}
/* ---------- Intro-Animation ---------- */
function playIntro(){
  const old=$("#intro");if(old)old.remove();
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const cols=Math.max(8,Math.round(innerWidth/72)),rows=Math.max(6,Math.round(innerHeight/72))+1;
  const pool=ITEMS.filter(i=>i.g==="basic").map(i=>i.k);
  let grid="";for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const dx=c-(cols-1)/2,dy=r-(rows-1)/2,dist=Math.sqrt(dx*dx+dy*dy);grid+=`<span style="--d:${(dist*.045).toFixed(2)}s">${pool[(Math.random()*pool.length)|0]}</span>`}
  const word=[["ひ","hi"],["ら","ra"],["が","ga"],["な","na"]].map(([k,r],n)=>`<span class="i-ch" style="--d:${(.3+n*.17).toFixed(2)}s">${k}<small>${r}</small></span>`).join("");
  const el=document.createElement("div");el.id="intro";el.setAttribute("aria-hidden","true");el.style.setProperty("--cols",cols);
  el.innerHTML=`<div class="i-grid">${grid}</div><div class="i-center"><div class="i-word">${word}</div><div class="i-line"></div><div class="i-sub">Trainer</div></div><button class="i-skip" type="button">Überspringen</button>`;
  document.body.appendChild(el);
  let done=false;
  const end=()=>{if(done)return;done=true;el.classList.add("out");setTimeout(()=>el.remove(),700);document.removeEventListener("keydown",key,true)};
  const key=e=>{e.preventDefault();e.stopPropagation();end()};
  el.addEventListener("click",end);document.addEventListener("keydown",key,true);
  setTimeout(end,reduced?1200:3100);
}
(function boot(){
  if(S.settings.intro!==false)playIntro();
  const h=location.hash.slice(1);if(VIEWS.includes(h))cur=h;
  go(cur,false);
  setTimeout(async()=>{
    try{if(window.claude&&window.claude.use){const t=await window.claude.use("tts");if(t){TTS=t;if(!SS)render()}}}catch(e){}
    initRemote();
  },0);
})();
</script>
